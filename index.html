<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socialhub - Social Media Manager</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

header {
    padding: 22px;
    background: #111827;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #38bdf8;
}

.container {
    padding: 25px 18px;
    max-width: 1000px;
    margin: auto;
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 35px;
}

.stat-card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
}

.stat-card h2 {
    color: #38bdf8;
    margin-bottom: 8px;
}

.section-title {
    margin-bottom: 18px;
}

.platforms {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
}

.platform {
    background: #1e293b;
    padding: 22px 15px;
    border-radius: 12px;
    text-align: center;
}

.platform h3 {
    margin-bottom: 15px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

footer {
    text-align: center;
    padding: 35px;
    color: #94a3b8;
}
</style>
</head>

<body>

<header>
    <div class="logo">Socialhub</div>
    <div>Dashboard</div>
</header>

<div class="container">

    <h1>Welcome to Socialhub 👋</h1>
    <p class="subtitle">
        Manage all your social media accounts in one place.
    </p>

    <div class="stats">

        <div class="stat-card">
            <h2>0</h2>
            <p>Connected Accounts</p>
        </div>

        <div class="stat-card">
            <h2>0</h2>
            <p>Published Posts</p>
        </div>

    </div>

    <h2 class="section-title">Connect Your Platforms</h2>

    <div class="platforms">

        <div class="platform">
            <h3>Instagram</h3>
            <button onclick="comingSoon()">Connect</button>
        </div>

        <div class="platform">
            <h3>Facebook</h3>
            <button onclick="comingSoon()">Connect</button>
        </div>

        <div class="platform">
            <h3>YouTube</h3>
            <button onclick="comingSoon()">Connect</button>
        </div>

        <div class="platform">
            <h3>X (Twitter)</h3>
            <button onclick="comingSoon()">Connect</button>
        </div>

    </div>

</div>

<footer>
    © 2026 Socialhub. All rights reserved.
</footer>

<script>
function comingSoon() {
    alert("Social media integration is coming soon!");
}
</script>

</body>
</html>
